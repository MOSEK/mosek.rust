name: CI
on:
  push:
    branches: [master,mosek-*]

jobs:
  test:
    name: Rust MOSEK
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: egor-tensin/setup-clang@v2
      - name: "Fetch and install MOSEK"
        run: |
            VER2=$(cat MOSEKVERSION)
            curl -o LATESTVER --silent -L -s https://download.mosek.com/stable/$VER2/version
            VERSION=$(cat LATESTVER)
            curl -L --silent -o mosektoolslinux64x86.tar.bz2 https://download.mosek.com/stable/$VERSION/mosektoolslinux64x86.tar.bz2
            tar  xf mosektoolslinux64x86.tar.bz2 -C $HOME/
      - name: Build MOSEK/Rust API
        env:
          MOSEK_INST_BASE: ${{ env.HOME }}
          LD_LIBRARY_PATH:  ${{ env.HOME }}/mosek/$(cat MOSEKVERSION)/tools/platform/linux64x86/bin
        run: |
            cargo build --release
            cargo build --release --examples
            cargo build --release --doc
      - name: Test MOSEK/Rust API
        env:
          MOSEKLIC: ${{ secrets.mosek_lic }}
          MOSEKLM_LICENSE_FILE: /tmp/mosek.lic
          MOSEK_INST_BASE: ${{ env.HOME }}
          LD_LIBRARY_PATH: ${{ env.HOME }}/mosek/$(cat MOSEKVERSION)/tools/platform/linux64x86/bin
        run: |
            echo "$MOSEKLIC" > $MOSEKLM_LICENSE_FILE
            cargo test --release
            cargo test --release --examples
            cargo test --release --doc
