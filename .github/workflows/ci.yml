name: CI
on:
  push:
    branches: [master,mosek-*]

jobs:
  test:
    name: Rust MOSEK
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: egor-tensin/setup-clang@v2
      - name: "Cargo Test"
        env:
          MOSEKLIC: ${{ secrets.mosek_lic }}
          MOSEKLM_LICENSE_FILE: /tmp/mosek.lic
        run: |
            VER2=$(cat MOSEKVERSION)
            VERSION=$(curl --silent -L -s https://download.mosek.com/stable/$VER2/version)
            LD_LIBRARY_PATH=mosek/$VER2/tools/platform/linux64x86/bin

            curl -L --silent -o mosektoolslinux64x86.tar.bz2 https://download.mosek.com/stable/latest/$VERSION/mosektoolslinux64x86.tar.bz2
            tar xf mosektoolslinux64x86.tar.bz2
            echo $MOSEKLIC > /tmp/mosek.lic
            cargo test
