name: CI
on:
  push:
    branches: [master,mosek-*]

jobs:
  test:
    name: Rust MOSEK
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
            echo "ver2=$(cat MOSEKVERSION)" > $GITHUB_OUTPUT
      - uses: mosek/installmosekaction@v1
        id: distro
        with:
          version: "${{ steps.version.outputs.ver2 }}"
      - name: "Store License"
        run: echo '${{ secrets.mosek_lic }}' > /tmp/mosek.lic
      - uses: dtolnay/rust-toolchain@stable
      - uses: egor-tensin/setup-gcc@v2
      - name: Build MOSEK/Rust API
        env:
            MOSEK_INST_BASE: ${{ steps.distro.outputs.mosekbasedir }}
        run: |
            cargo build --release
      - name: Build MOSEK/Rust API Examples
        env:
            MOSEK_INST_BASE: ${{ steps.distro.outputs.mosekbasedir }}
        run: |
            cargo build --release --examples
      - name: Test MOSEK/Rust API
        env:
            MOSEKLM_LICENSE_FILE=/tmp/mosek.lic
            MOSEK_INST_BASE=${{ steps.distro.outputs.mosekbasedir }}
            LD_LIBRARY_PATH=${{ steps.distro.outputs.mosekbindir }}
        run: |
            cargo test --release
      - name: Test MOSEK/Rust API Examples
        env:
            MOSEKLM_LICENSE_FILE=/tmp/mosek.lic
            MOSEK_INST_BASE=${{ steps.distro.outputs.mosekbasedir }}
            LD_LIBRARY_PATH=${{ steps.distro.outputs.mosekbindir }}
        run: |
            cargo test --release --examples
      - name: Test MOSEK/Rust API Doc strings
        env:
            MOSEKLM_LICENSE_FILE=/tmp/mosek.lic
            MOSEK_INST_BASE=${{ steps.distro.outputs.mosekbasedir }}
            LD_LIBRARY_PATH=${{ steps.distro.outputs.mosekbindir }}
        run: |
            cargo test --release --doc
