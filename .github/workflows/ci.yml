name: CI
on:
  push:
    branches: [master,mosek-*]

jobs:
  test:
    name: Rust MOSEK
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: egor-tensin/setup-clang@v2
      - name: "Cargo Test"
        env:
          MOSEKLIC: ${{ secret.mosek_lic }}
          MOSEKLM_LICENSE_FILE: /tmp/mosek.lic
        run: |
            echo $MOSEKLIC > /tmp/mosek.lic
            cargo test
